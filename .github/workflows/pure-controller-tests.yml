name: Pure controller tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  controller-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-test dependencies
        run: python -m pip install numpy PyYAML pytest
      - name: Test control geometry and configuration
        env:
          PYTHONPATH: ros2_ws/src/cyclic_pursuit
        run: |
          python -m pytest -q \
            ros2_ws/src/cyclic_pursuit/test/test_control_logic.py \
            ros2_ws/src/cyclic_pursuit/test/test_example_config.py
